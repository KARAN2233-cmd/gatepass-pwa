<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate Pass — Ajmer Industries</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0f14; color: #e8eaf0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #13161e; border: 1px solid #242836;
      border-radius: 16px; padding: 36px; max-width: 400px;
      width: 100%; text-align: center;
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p  { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      background: #f0a500; color: #000; border: none;
      border-radius: 10px; padding: 14px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      width: 100%; margin-bottom: 12px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px;
      border-radius: 8px; font-size: 13px; display: none;
    }
    .success { background: rgba(34,197,94,.15); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
    .error   { background: rgba(239,68,68,.15);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .info    { background: rgba(59,130,246,.15); color: #3b82f6; border: 1px solid rgba(59,130,246,.3); }
    select {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      background: #1a1e29; border: 1px solid #242836;
      border-radius: 8px; color: #e8eaf0; font-size: 14px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🏭</div>
  <h1>Gate Pass Alerts</h1>
  <p>Select your role and enable notifications to receive instant gate pass alerts.</p>

  <select id="role-select">
    <option value="">-- Select Your Role --</option>
    <option value="manoj">Manoj (Approver)</option>
    <option value="guard">Guard (Gate)</option>
  </select>

  <button class="btn" id="enable-btn" onclick="enableNotifications()">
    🔔 Enable Notifications
  </button>

  <div class="status" id="status-box"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<script>
  // ── FILL THESE VALUES ─────────────────────────────────
  const firebaseConfig = {
  apiKey: "AIzaSyDbX44eylIbr2Fa9gRv7W5cJB0rWCvJ0W4",
  authDomain: "ajmergatepass.firebaseapp.com",
  projectId: "ajmergatepass",
  storageBucket: "ajmergatepass.firebasestorage.app",
  messagingSenderId: "704734310536",
  appId: "1:704734310536:web:5e9f46249c062077012f3d"
  };
  const VAPID_KEY      = "BGHA4erBE--LuTnXLdlBkmdus4ki6Ztkqxpo7zGzAyYJoxjNpaKIu-dHpa6HlZZQw0_hc_2KXKIrkGCVPZIGJgs";
  const SAVE_TOKEN_URL = "https://script.google.com/macros/s/AKfycbzAglZWtcKxHmZQN2iemW5c8YVxTzjLSajglfs_CRo0enfddTkIfRo-NjBxuNsSafBk/exec";
  // ─────────────────────────────────────────────────────

  firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();

  // Register service worker from same origin
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker
      .register('/gatepass-pwa/firebase-messaging-sw.js')
      .then(reg => console.log('SW registered', reg))
      .catch(err => console.error('SW error', err));
  }

  async function enableNotifications() {
    const btn    = document.getElementById("enable-btn");
    const role   = document.getElementById("role-select").value;

    if (!role) {
      showStatus("error", "❌ Please select your role first.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Setting up…";
    showStatus("info", "Requesting permission…");

    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        showStatus("error", "❌ Permission denied. Tap the 🔒 icon in address bar → Allow Notifications.");
        btn.disabled = false;
        btn.textContent = "🔔 Enable Notifications";
        return;
      }

      showStatus("info", "Getting device token…");
      const swReg  = await navigator.serviceWorker.ready;
      const token  = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });

      if (!token) {
        showStatus("error", "❌ Token failed. Make sure you are on HTTPS.");
        btn.disabled = false;
        btn.textContent = "🔔 Enable Notifications";
        return;
      }

      showStatus("info", "Saving token…");
// REPLACE WITH THIS
await fetch(
  SAVE_TOKEN_URL + "?action=saveToken&role=" + role + "&token=" + encodeURIComponent(token),
  { mode: 'no-cors' }
);

// no-cors means we can't read the response, but the request DOES go through
// So we just trust it worked if no exception was thrown
showStatus("success", "✅ Done! You will now receive gate pass notifications on this device.");
btn.textContent = "✅ Notifications Active";

    } catch(err) {
      showStatus("error", "❌ " + err.message);
      btn.disabled = false;
      btn.textContent = "🔔 Enable Notifications";
    }
  }

  function showStatus(type, msg) {
    const el = document.getElementById("status-box");
    el.className = "status " + type;
    el.textContent = msg;
    el.style.display = "block";
  }

  // Foreground notification
  messaging.onMessage(payload => {
    const n = payload.notification;
    if (Notification.permission === "granted") {
      new Notification(n.title, { body: n.body });
    }
  });
</script>
</body>
</html>
